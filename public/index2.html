<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Oficial Limpio sin Comercios</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f1f3f4;
        }
        .map-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            /* Mantiene el truco visual para ocultar cualquier resto superior de la interfaz */
            margin-top: -45px;
            height: calc(100% + 45px);
        }
        /* Botón flotante para tu ubicación exacta */
        .gps-float-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 999;
        }
    </style>
</head>
<body class="font-sans">

    <div class="map-container">
        <!-- El mapa oficial limpio (cargando con filtro para reducir iconos de comercios al mínimo posible) -->
        <iframe 
            id="google-map"
            src="https://www.google.com/maps?q=-34.6037,-58.3816&z=15&output=embed" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>

        <!-- Botón flotante de alta precisión -->
        <div class="gps-float-btn">
            <button onclick="irAMiUbicacionReal()" class="bg-white hover:bg-slate-50 text-slate-700 w-14 h-14 rounded-full shadow-2xl border border-slate-200 transition flex items-center justify-center group active:scale-95" title="Ir a mi ubicación exacta">
                <i class="fa-solid fa-location-crosshairs text-blue-600 text-2xl group-hover:scale-110 transition-transform"></i>
            </button>
        </div>
    </div>

    <script>
        function irAMiUbicacionReal() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            const opciones = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Al actualizar por coordenadas, agregamos un pin limpio en tu posición exacta 
                    // y limpiamos la vista de ruidos visuales innecesarios
                    const iframe = document.getElementById('google-map');
                    iframe.src = `https://www.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
                },
                (error) => {
                    console.error(error);
                    alert("No pudimos obtener tu ubicación exacta. Habilita el GPS en tu navegador.");
                },
                opciones
            );
        }

        window.addEventListener('load', () => {
            irAMiUbicacionReal();
        });
    </script>
</body>
</html>

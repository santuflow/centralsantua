<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa 100% Limpio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        /* Botón flotante GPS profesional */
        .gps-button {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="font-sans relative">

    <!-- MAPA LIMPIO (Solo calles y nombres, sin rastro de comercios) -->
    <div id="map"></div>

    <!-- BOTÓN GPS FLOTANTE DE ALTA PRECISIÓN -->
    <div class="gps-button">
        <button onclick="centrarUbicacionReal()" class="bg-white hover:bg-slate-50 text-slate-700 w-14 h-14 rounded-full shadow-2xl border border-slate-200 transition flex items-center justify-center group active:scale-95" title="Ir a mi ubicación exacta">
            <i class="fa-solid fa-location-crosshairs text-blue-600 text-2xl group-hover:scale-110 transition-transform"></i>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicializar Mapa centrado provisionalmente en Buenos Aires
        const map = L.map('map', { zoomControl: false }).setView([-34.6037, -58.3816], 14);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // CAPA CARTODB NO LABELS / POSITRON LIMPIO: Esta capa muestra estrictamente las calles, autopistas y los nombres de las calles. Los negocios, tiendas y restaurantes no existen en este mapa.
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            subdomains: 'abcd',
            attribution: '&copy; CARTO'
        }).addTo(map);

        // Agregamos una capa superior transparente solo para las etiquetas de los nombres de las calles bien nítidas
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            subdomains: 'abcd',
            pane: 'markerPane' // Asegura que los nombres de las calles queden arriba
        }).addTo(map);

        let markerUsuario = null;
        let precisionCirculo = null;

        function centrarUbicacionReal() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            const opciones = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // Centrar el mapa con zoom exacto de calle
                    map.setView([lat, lng], 17, { animate: true });

                    if (markerUsuario) map.removeLayer(markerUsuario);
                    if (precisionCirculo) map.removeLayer(precisionCirculo);

                    // Círculo de precisión del GPS
                    precisionCirculo = L.circle([lat, lng], {
                        radius: accuracy / 2,
                        color: '#2563eb',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);

                    // Marcador de tu ubicación exacta
                    markerUsuario = L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: 'custom-gps-pin',
                            html: '<div style="background-color: #2563eb; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px rgba(37,99,235,0.9);"></div>',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        })
                    }).addTo(map);

                    markerUsuario.bindPopup("<div class='font-bold text-xs text-slate-800 p-1'>¡Estás aquí!</div>").openPopup();
                },
                (error) => {
                    console.error(error);
                    alert("No pudimos obtener tu ubicación exacta. Habilita el GPS en tu navegador.");
                },
                opciones
            );
        }

        // Centrar automáticamente apenas carga la página
        window.addEventListener('load', () => {
            centrarUbicacionReal();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Limpio Profesional</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        .top-ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }
        .interactive-el {
            pointer-events: auto;
        }
        .gps-button {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="font-sans relative">

    <div id="map"></div>

    <div class="top-ui-container flex flex-col gap-3">
        <header class="interactive-el bg-white/95 backdrop-blur-md shadow-lg border border-slate-200/80 rounded-2xl p-3.5 flex items-center justify-between transition-all">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/30">
                    <i class="fa-solid fa-compass text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-sm leading-tight">Tu Plataforma</h1>
                    <span id="user-status-text" class="text-xs text-slate-500 font-medium">Iniciá sesión para ver categorías</span>
                </div>
            </div>

            <div id="auth-buttons-container" class="flex items-center gap-2">
                <button onclick="abrirModal('loginModal')" class="px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100 rounded-xl transition">
                    Iniciar Sesión
                </button>
                <button onclick="abrirModal('registerModal')" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md shadow-blue-500/25 transition active:scale-95">
                    Registrarse
                </button>
            </div>

            <div id="user-profile-container" class="hidden flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                    <div class="w-7 h-7 bg-emerald-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-inner">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="nombre-usuario-display" class="text-xs font-bold text-slate-700">Usuario</span>
                </div>
                <button onclick="cerrarSesion()" class="text-slate-400 hover:text-red-500 p-2 rounded-xl transition" title="Cerrar Sesión">
                    <i class="fa-solid fa-power-off text-sm"></i>
                </button>
            </div>
        </header>

        <div id="categories-panel" class="interactive-el hidden transition-all duration-300">
            <div class="bg-white/95 backdrop-blur-md shadow-xl border border-slate-200/80 rounded-2xl p-2.5 overflow-x-auto no-scrollbar flex items-center gap-2">
                <button onclick="filtrarCategoria('productos')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🛍️</span> Productos</button>
                <button onclick="filtrarCategoria('negocios')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🏪</span> Negocios</button>
                <button onclick="filtrarCategoria('servicios')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🔧</span> Servicios</button>
                <button onclick="filtrarCategoria('ferias')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🏕️</span> Ferias</button>
                <button onclick="filtrarCategoria('empleos')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>💼</span> Empleos</button>
                <button onclick="filtrarCategoria('comida')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🍔</span> Comida</button>
                <button onclick="filtrarCategoria('vehiculos')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🚗</span> Vehículos</button>
                <button onclick="filtrarCategoria('perdidos')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🔎</span> Perdidos</button>
                <button onclick="filtrarCategoria('mascotas')" class="flex items-center gap-2 px-3.5 py-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 whitespace-nowrap transition active:scale-95 shadow-sm"><span>🐾</span> Mascotas</button>
            </div>
        </div>
    </div>

    <div class="gps-button">
        <button onclick="centrarUbicacionReal()" class="bg-white hover:bg-slate-50 text-slate-700 w-14 h-14 rounded-full shadow-2xl border border-slate-200 transition flex items-center justify-center group active:scale-95" title="Ir a mi ubicación exacta">
            <i class="fa-solid fa-location-crosshairs text-blue-600 text-2xl group-hover:scale-110 transition-transform"></i>
        </button>
    </div>

    <div id="loginModal" class="fixed inset-0 z-[2000] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-slate-100 relative">
            <button onclick="cerrarModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-slate-800 text-lg mb-1">Iniciar Sesión</h3>
            <p class="text-xs text-slate-500 mb-5">Ingresá para acceder a las categorías del mapa.</p>
            <form onsubmit="simularLogin(event, 'loginModal')">
                <div class="space-y-3 mb-5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Correo electrónico</label>
                        <input type="email" required placeholder="tu@correo.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-md transition">Entrar al Sistema</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="fixed inset-0 z-[2000] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-slate-100 relative">
            <button onclick="cerrarModal('registerModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-slate-800 text-lg mb-1">Crear Cuenta</h3>
            <p class="text-xs text-slate-500 mb-5">Registrate gratis para empezar a explorar.</p>
            <form onsubmit="simularLogin(event, 'registerModal')">
                <div class="space-y-3 mb-5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Nombre y Apellido</label>
                        <input type="text" id="reg-name" required placeholder="Juan Pérez" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Correo electrónico</label>
                        <input type="email" required placeholder="tu@correo.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Contraseña</label>
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-md transition">Completar Registro</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([-34.6037, -58.3816], 14);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markerUsuario = null;
        let precisionCirculo = null;

        function centrarUbicacionReal() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    map.setView([lat, lng], 17, { animate: true });

                    if (markerUsuario) map.removeLayer(markerUsuario);
                    if (precisionCirculo) map.removeLayer(precisionCirculo);

                    precisionCirculo = L.circle([lat, lng], {
                        radius: accuracy / 2,
                        color: '#2563eb',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);

                    markerUsuario = L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: 'custom-gps-pin',
                            html: '<div style="background-color: #2563eb; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px rgba(37,99,235,0.9);"></div>',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        })
                    }).addTo(map);

                    markerUsuario.bindPopup("<div class='font-bold text-xs text-slate-800 p-1'>¡Estás aquí!</div>").openPopup();
                },
                (error) => {
                    console.error(error);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function abrirModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function simularLogin(event, modalId) {
            event.preventDefault();
            let nombre = "Usuario";
            if(modalId === 'registerModal') {
                const inputName = document.getElementById('reg-name').value;
                if(inputName) nombre = inputName.split(' ')[0];
            } else {
                nombre = "Mi Cuenta";
            }

            cerrarModal(modalId);
            
            document.getElementById('auth-buttons-container').classList.add('hidden');
            document.getElementById('user-profile-container').classList.remove('hidden');
            document.getElementById('nombre-usuario-display').innerText = nombre;
            document.getElementById('user-status-text').innerText = "Sesión iniciada correctamente";
            document.getElementById('categories-panel').classList.remove('hidden');
        }

        function cerrarSesion() {
            document.getElementById('user-profile-container').classList.add('hidden');
            document.getElementById('auth-buttons-container').classList.remove('hidden');
            document.getElementById('categories-panel').classList.add('hidden');
            document.getElementById('user-status-text').innerText = "Iniciá sesión para ver categorías";
        }

        function filtrarCategoria(categoria) {
            document.getElementById('user-status-text').innerText = `Filtrando por: ${categoria.toUpperCase()}`;
        }

        window.addEventListener('load', () => {
            centrarUbicacionReal();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Maps Profesional</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f1f3f4;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        /* Botón flotante GPS estilo app profesional */
        .gps-button {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 1000;
        }
    </style>

    <!-- Script Oficial de Google Maps (Reemplazá TU_API_KEY_DE_GOOGLE con tu clave de Google Cloud Console) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY_DE_GOOGLE&libraries=geometry" async defer></script>
</head>
<body class="font-sans relative">

    <!-- CONTENEDOR DEL MAPA OFICIAL DE GOOGLE -->
    <div id="map"></div>

    <!-- BOTÓN FLOTANTE DE UBICACIÓN EXACTA (GPS) -->
    <div class="gps-button">
        <button onclick="irAUbicacionActual()" class="bg-white hover:bg-slate-50 text-slate-700 w-12 h-12 rounded-full shadow-2xl border border-slate-200 transition flex items-center justify-center group active:scale-95" title="Centrar en mi ubicación">
            <i class="fa-solid fa-location-crosshairs text-blue-600 text-xl group-hover:scale-110 transition-transform"></i>
        </button>
    </div>

    <script>
        let map;
        let markerUsuario = null;
        let watchId = null;

        // Función que ejecuta Google Maps al cargar el script correctamente
        window.initMap = function() {
            // Coordenadas iniciales por defecto (Buenos Aires)
            const centroDefault = { lat: -34.6037, lng: -58.3816 };

            // Instancia del mapa con diseño profesional, limpio y controles avanzados nativos
            map = new google.maps.Map(document.getElementById("map"), {
                center: centroDefault,
                zoom: 15,
                disableDefaultUI: true, // Oculta controles por defecto para dejarlo súper limpio estilo app
                zoomControl: false,     // Usaremos nuestros propios controles o gestos táctiles fluidos
                styles: [               // Opcional: Estilo limpio optimizado (elimina saturación visual excesiva)
                    {
                        featureType: "poi",
                        elementType: "labels",
                        stylers: [{ visibility: "off" }] // Oculta carteles molestos de negocios menores si se desea
                    }
                ]
            });

            // Pedir ubicación automáticamente al iniciar la página
            irAUbicacionActual();
        };

        // Función profesional para solicitar permiso de GPS y centrar el mapa exactamente
        function irAUbicacionActual() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                    };

                    // Centrar el mapa de Google con animación fluida
                    map.setCenter(pos);
                    map.setZoom(17);

                    // Si ya existe el marcador del usuario, actualizar su posición
                    if (markerUsuario) {
                        markerUsuario.setPosition(pos);
                    } else {
                        // Crear un marcador profesional tipo punto azul de Google Maps
                        markerUsuario = new google.maps.Marker({
                            position: pos,
                            map: map,
                            title: "¡Estás aquí!",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 9,
                                fillcolor: "#1a73e8",
                                fillOpacity: 1,
                                strokeColor: "#ffffff",
                                strokeWeight: 3,
                            }
                        });
                    }
                },
                (error) => {
                    console.error("Error de geolocalización:", error);
                    alert("Por favor, permití el acceso a tu ubicación en el navegador para usar el GPS.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Manejador por si el script de Google carga antes de que el DOM esté listo
        window.onload = function() {
            if (typeof google === 'object' && typeof google.maps === 'object') {
                initMap();
            } else {
                // Intervalo de seguridad por si la red demora en cargar la API de Google
                const checkGoogle = setInterval(() => {
                    if (typeof google === 'object' && typeof google.maps === 'object') {
                        clearInterval(checkGoogle);
                        initMap();
                    }
                }, 100);
            }
        };
    </script>
</body>
</html>
